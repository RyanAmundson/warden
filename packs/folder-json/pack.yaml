id: folder-json
layer: 4
terms:
  - id: leaf-folder
    definition: A folder with no subfolders, such as a component folder; the only folder below a collection that holds more than one file.
    bans: []
practices:
  - id: folders-hold-one-file-until-the-leaf
    statement: Below a collection, a folder is shaped like JSON. A file is a property, a folder is an object, and a collection is an array, so a folder with subfolders holds at most one file and only a leaf-folder holds many.
    terms: [collection, leaf-folder]
    paths: ["**/*"]
    conflictsWith: []
    guardrails:
      - id: warden-folders-hold-one-file-until-the-leaf
        kind: runtime
        runs: [edit, commit]
        budgetMs: 2000
        version: 1
        implementation: >-
          cmd:node -e '
          const cp=require("node:child_process"),fs=require("node:fs");
          const git=cp.spawnSync("git",["rev-parse","--is-inside-work-tree"],{encoding:"utf8"}).stdout.trim()==="true";
          const files=git?new Set(cp.execFileSync("git",["ls-files","-z","--cached","--others","--exclude-standard"],{encoding:"utf8",maxBuffer:1<<28}).split("\0").filter(Boolean)):fs.readdirSync(".",{recursive:true}).filter(f=>!f.split("/").some(s=>s==="node_modules"||s===".git")&&fs.lstatSync(f).isFile());
          const b=s=>/^\[.*\]$/.test(s);
          const held=new Map(),subs=new Map();
          const add=(map,key,file)=>{if(!map.has(key))map.set(key,[]);map.get(key).push(file)};
          for(const f of files){
            const dirs=f.split("/"),name=dirs.pop(),collection=dirs.findIndex(b);
            if(collection<0)continue;
            for(let i=collection+2;i<dirs.length;i++)add(subs,dirs.slice(0,i).join("/"),f);
            if(collection===dirs.length-1||b(dirs[dirs.length-1]))continue;
            add(held,dirs.join("/"),name);
          }
          const bad=[];
          for(const [dir,names] of held){
            const descendants=subs.get(dir);
            if(names.length<2||!descendants)continue;
            const present=git?names.filter(name=>fs.existsSync(`${dir}/${name}`)):names;
            if(present.length>1&&(!git||descendants.some(file=>fs.existsSync(file))))bad.push([dir,present]);
          }
          if(bad.length>0){console.log(bad.map(([d,n])=>`${d} has subfolders and ${n.length} files, where at most one is allowed: ${n.sort().join(", ")}`).join("\n"));console.log(`${bad.length} folder(s) with subfolders hold more than one file. Next action: in each listed folder, keep at most one file and move the others into a subfolder that has no subfolders of its own.`);process.exitCode=1}
          '
        mustFail:
          "src/[widgets]/button/index.ts": "export const button = 1;\n"
          "src/[widgets]/button/styles.ts": "export const styles = 1;\n"
          "src/[widgets]/button/parts/knob/index.ts": "export const knob = 1;\n"
        mustPass:
          "src/[widgets]/button/index.ts": "export const button = 1;\n"
          "src/[widgets]/button/parts/knob/index.ts": "export const knob = 1;\n"
          "src/[widgets]/button/parts/knob/styles.ts": "export const styles = 1;\n"
