id: core
layer: 0
terms:
  - id: guardrail
    definition: A check that turns a practice into a pass or fail result on source files.
    bans: [tripwire]
practices:
  - id: no-comments
    statement: Source files carry no comments.
    terms: [guardrail]
    paths: ["**/*.ts"]
    conflictsWith: []
    guardrails:
      - id: warden-no-comments
        kind: lint
        runs: [edit, commit]
        budgetMs: 5000
        version: 1
        implementation: "eslint:warden/no-comments"
        mustFail: "// a comment\nconst a = 1;\n"
        mustPass: "const a = 1;\n"
  - id: no-suppressions
    statement: Source files carry no inline suppressions and no skipped tests.
    terms: [guardrail]
    paths: ["**/*.ts"]
    conflictsWith: []
    guardrails:
      - id: warden-no-suppressions
        kind: lint
        runs: [edit, commit]
        budgetMs: 5000
        version: 1
        implementation: "eslint:warden/no-suppressions"
        mustFail: "it.skip(\"x\", () => {});\n"
        mustPass: "it(\"x\", () => {});\n"
