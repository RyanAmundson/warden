id: core
layer: 0
terms:
  - id: guardrail
    definition: A check that turns a practice into a pass or fail result on source files.
    bans: [tripwire]
practices:
  - id: no-comments
    statement: Source files carry no comments.
    terms: [guardrail]
    paths: ["**/*.{ts,tsx,mts,cts,js,mjs,cjs}"]
    conflictsWith: []
    guardrails:
      - id: warden-no-comments
        kind: lint
        runs: [edit, commit]
        budgetMs: 5000
        version: 1
        implementation: "eslint:warden/no-comments"
        mustFail: "// sum of every price\nexport const total = (prices: number[]): number => prices.reduce((sum, price) => sum + price, 0);\n"
        mustPass: "export const sumOfPrices = (prices: number[]): number => prices.reduce((sum, price) => sum + price, 0);\n"
  - id: no-suppressions
    statement: Source files carry no inline suppressions and no skipped tests.
    terms: [guardrail]
    paths: ["**/*.{ts,tsx,mts,cts,js,mjs,cjs}"]
    conflictsWith: []
    guardrails:
      - id: warden-no-suppressions
        kind: lint
        runs: [edit, commit]
        budgetMs: 5000
        version: 1
        implementation: "eslint:warden/no-suppressions"
        mustFail: "it.skip(\"adds two prices\", () => {\n  expect(sumOfPrices([1, 2])).toBe(3);\n});\n"
        mustPass: "it(\"adds two prices\", () => {\n  expect(sumOfPrices([1, 2])).toBe(3);\n});\n"
  - id: unit-layout
    statement: Each declared Unit owns its folder layout and one document with fixed sections.
    terms: [guardrail]
    paths: []
    conflictsWith: []
    guardrails:
      - id: warden-unit-layout
        kind: lint
        runs: [boundary]
        budgetMs: 5000
        version: 1
        implementation: "fs:core/unit-layout"
        scope: project
        unitExample:
          folder: service
          kind:
            document: CONTRACT.md
            sections: [Purpose, Interfaces]
            layout: ["src/**/*.ts"]
        mustPass:
          "service/CONTRACT.md": "# service\n\n## Purpose\n\n## Interfaces\n"
          "service/src/port.ts": "export const ready = true;\n"
        mustFail:
          "service/CONTRACT.md": "# service\n\n## Interfaces\n\n## Purpose\n"
          "service/src/port.ts": "export const ready = true;\n"
