id: collection-folders
layer: 3
terms:
  - id: collection
    definition: A folder whose bracketed name, such as [services], marks it as an array of item folders of one kind.
    bans: []
practices:
  - id: collection-holds-only-folders
    statement: A collection holds only item folders, never loose files.
    terms: [collection]
    paths: ["**/*"]
    conflictsWith: []
    guardrails:
      - id: warden-collection-holds-only-folders
        kind: runtime
        runs: [edit, commit]
        budgetMs: 2000
        version: 1
        implementation: 'cmd:node "$WARDEN_PACK_DIR/holds-only-folders.cjs"'
        mustFail:
          "src/[widgets]/button/index.ts": "export const button = 1;\n"
          "src/[widgets]/notes.ts": "export const notes = 1;\n"
        mustPass:
          "src/[widgets]/button/index.ts": "export const button = 1;\n"
          "src/[widgets]/card/index.ts": "export const card = 1;\n"
  - id: collections-do-not-nest
    statement: A collection never directly contains another collection.
    terms: [collection]
    paths: ["**/*"]
    conflictsWith: []
    guardrails:
      - id: warden-collections-do-not-nest
        kind: runtime
        runs: [edit, commit]
        budgetMs: 2000
        version: 1
        implementation: 'cmd:node "$WARDEN_PACK_DIR/do-not-nest.cjs"'
        mustFail:
          "src/[widgets]/[parts]/knob/index.ts": "export const knob = 1;\n"
        mustPass:
          "src/[widgets]/parts/[knobs]/round/index.ts": "export const round = 1;\n"
  - id: collection-names-are-plural-kebab-case
    statement: A collection is named in lowercase kebab-case, plural, in brackets.
    terms: [collection]
    paths: ["**/*"]
    conflictsWith: []
    guardrails:
      - id: warden-collection-names-are-plural-kebab-case
        kind: runtime
        runs: [edit, commit]
        budgetMs: 2000
        version: 2
        implementation: 'cmd:node "$WARDEN_PACK_DIR/plural-kebab-case.cjs"'
        mustFail:
          "src/[Widget]/button/index.ts": "export const button = 1;\n"
        mustPass:
          "src/[quality-gates]/lint/index.ts": "export const lint = 1;\n"
          "src/[quality-gates]/test/index.ts": "export const test = 1;\n"
  - id: collection-items-share-one-shape
    statement: Every item of a collection has the same top-level files and folders as the other items in it, with names that repeat the item name compared as <item>.
    terms: [collection]
    paths: ["**/*"]
    conflictsWith: []
    guardrails:
      - id: warden-collection-items-share-one-shape
        kind: runtime
        runs: [edit, commit]
        budgetMs: 2000
        version: 1
        implementation: 'cmd:node "$WARDEN_PACK_DIR/items-share-one-shape.cjs"'
        mustFail:
          "src/[widgets]/button/index.ts": "export const button = 1;\n"
          "src/[widgets]/card/index.ts": "export const card = 1;\n"
          "src/[widgets]/knob/knob.ts": "export const knob = 1;\n"
        mustPass:
          "src/[widgets]/button/index.ts": "export const button = 1;\n"
          "src/[widgets]/card/index.ts": "export const card = 1;\n"
