id: unit-layout
layer: 10
terms: []
practices:
  - id: unit-layout
    statement: Each declared Unit owns its folder layout and one document with fixed sections.
    terms: []
    paths: []
    conflictsWith: []
    guardrails:
      - id: warden-unit-layout
        kind: lint
        runs: [boundary]
        budgetMs: 5000
        version: 1
        implementation: "fs:unit-layout/unit-layout"
        scope: project
        unitExample:
          folder: service
          kind:
            document: CONTRACT.md
            sections: [Purpose, Interfaces]
            layout: ["src/**/*.ts"]
        mustPass:
          "service/CONTRACT.md": "# service\n\n## Purpose\n\n## Interfaces\n"
          "service/src/port.ts": "export const ready = true;\n"
        mustFail:
          "service/CONTRACT.md": "# service\n\n## Interfaces\n\n## Purpose\n"
          "service/src/port.ts": "export const ready = true;\n"
  - id: unit-document-links
    statement: Local links in Unit and root documents resolve to repository files or folders. Fragments in Markdown destinations resolve to headings or explicit anchors.
    terms: []
    paths: []
    conflictsWith: []
    guardrails:
      - id: warden-unit-document-links
        kind: lint
        runs: [boundary]
        budgetMs: 5000
        version: 2
        implementation: "fs:unit-layout/document-links"
        scope: project
        unitExample:
          folder: service
          kind:
            document: CONTRACT.md
            sections: [Purpose, Interfaces]
            layout: ["src/**/*.ts"]
        mustPass:
          "service/CONTRACT.md": "# service\n\n## Purpose\n\nSee [the port][port] and [Interfaces](#interfaces).\n\n[port]: src/port.ts\n\n## Interfaces\n"
          "service/src/port.ts": "export const ready = true;\n"
        mustFail:
          "service/CONTRACT.md": "# service\n\n## Purpose\n\nSee [the contract section](#missing).\n\n## Interfaces\n"
          "service/src/port.ts": "export const ready = true;\n"
