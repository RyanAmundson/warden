id: unit-layout
layer: 10
terms:
  - id: unit-layout/document
    definition: The one Markdown document owned by a declared Unit.
    bans: []
practices:
  - id: unit-layout
    statement: Each declared Unit owns its folder layout and one document with fixed sections.
    terms: []
    paths: []
    conflictsWith: []
    guardrails:
      - id: warden-unit-layout
        kind: lint
        runs: [boundary]
        budgetMs: 5000
        version: 1
        implementation: "fs:unit-layout/unit-layout"
        scope: project
        unitExample:
          folder: service
          kind:
            document: CONTRACT.md
            sections: [Purpose, Interfaces]
            layout: ["src/**/*.ts"]
        mustPass:
          "service/CONTRACT.md": "# service\n\n## Purpose\n\n## Interfaces\n"
          "service/src/port.ts": "export const ready = true;\n"
        mustFail:
          "service/CONTRACT.md": "# service\n\n## Interfaces\n\n## Purpose\n"
          "service/src/port.ts": "export const ready = true;\n"
  - id: unit-document-links
    statement: Local links in Unit and root documents resolve to repository files or folders. Fragments in Markdown destinations resolve to headings or explicit anchors. Term destinations name configured Term IDs.
    terms: []
    paths: []
    conflictsWith: []
    guardrails:
      - id: warden-unit-document-links
        kind: lint
        runs: [boundary]
        budgetMs: 5000
        version: 3
        implementation: "fs:unit-layout/document-links"
        scope: project
        unitExample:
          folder: service
          kind:
            document: CONTRACT.md
            sections: [Purpose, Interfaces]
            layout: ["src/**/*.ts"]
        mustPass:
          "service/CONTRACT.md": "# service\n\n## Purpose\n\nSee [the port][port] and [Interfaces](#interfaces).\n\n[port]: src/port.ts\n\n## Interfaces\n"
          "service/src/port.ts": "export const ready = true;\n"
        mustFail:
          "service/CONTRACT.md": "# service\n\n## Purpose\n\nSee [the contract section](#missing).\n\n## Interfaces\n"
          "service/src/port.ts": "export const ready = true;\n"

  - id: unit-term-definitions
    statement: Unit and root documents link to Terms instead of copying their definitions.
    terms: [unit-layout/document]
    paths: []
    conflictsWith: []
    guardrails:
      - id: warden-unit-term-definitions
        kind: lint
        runs: [boundary]
        budgetMs: 5000
        version: 1
        implementation: "fs:unit-layout/term-definitions"
        scope: project
        unitExample:
          folder: service
          kind:
            document: CONTRACT.md
            sections: [Purpose]
        mustPass:
          "service/CONTRACT.md": "# service\n\n## Purpose\n\nSee the [Unit document](term:unit-layout%2Fdocument).\n"
        mustFail:
          "service/CONTRACT.md": "# service\n\n## Purpose\n\nThe one Markdown document owned by a declared Unit.\n"
