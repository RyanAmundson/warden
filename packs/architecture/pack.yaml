id: architecture
layer: 1
terms:
  - id: world
    definition: Anything outside the process's own memory, which is the file system, child processes, the network, and the clock.
    bans: []
  - id: source
    definition: Code in a sources folder that reads the world and produces data as an Observable.
    bans: []
  - id: sink
    definition: Code in a sinks folder that consumes data and writes it to a store, a log, or a view.
    bans: []
  - id: port
    definition: The one file through which code outside a group reaches it, declaring only the group's types and its factory type.
    bans: []
  - id: group
    definition: A folder in a group collection that owns one responsibility behind one port.
    bans: []
  - id: implementation
    definition: The code inside a group that fulfills its port, built by a create factory.
    bans: []
  - id: adapter
    definition: One of several swappable implementations of a port, in an adapters folder of its group.
    bans: []
  - id: conformance-suite
    definition: The tests a port defines, which every implementation of that port must pass.
    bans: []
  - id: composition-root
    definition: A file that chooses which implementation fills each port and connects sources to sinks.
    bans: []
settings:
  type: object
  additionalProperties: false
  properties:
    groupCollections:
      type: array
      default: []
      items:
        type: object
        additionalProperties: false
        required: [collection]
        properties:
          collection: { type: string, minLength: 1 }
          suffix: { type: string, default: "" }
          port: { type: string, pattern: "\\{name\\}", default: "{name}/{name}.ts" }
    technicalCollections: { type: array, items: { type: string, minLength: 1 }, default: [] }
    compositionRoots: { type: array, items: { type: string, minLength: 1 }, default: [] }
    world:
      type: array
      items: { type: string, minLength: 1 }
      default: [fs, fs/promises, child_process, net, http, https, http2, dgram, dns, dns/promises, tls, worker_threads, timers, timers/promises]
    sinkModules: { type: array, items: { type: string, minLength: 1 }, default: [] }
  examples:
    - groupCollections: [{ collection: "[services]", suffix: "-service" }]
      technicalCollections: ["src/[utils]"]
      compositionRoots: ["**/main.ts"]
      sinkModules: [rxdb]
practices:
  - id: architecture-world-only-in-sources
    statement: Only a source reaches the world.
    terms: [source, world]
    paths: ["!**/{sources/**,test/**,tests/**,__tests__/**,*.test.*,*.spec.*,*.config.*}"]
    conflictsWith: []
    guardrails:
      - id: architecture-world-modules
        kind: lint
        runs: [edit, commit]
        budgetMs: 5000
        version: 2
        implementation: "eslint:architecture/world-modules"
        mustFail:
          src/git/format.ts: "import { readFileSync } from \"node:fs\";\nexport const readConfig = (path: string): string => readFileSync(path, \"utf8\");\n"
        mustPass:
          src/git/sources/config-file.ts: "import { readFileSync } from \"node:fs\";\nexport const readConfig = (path: string): string => readFileSync(path, \"utf8\");\n"
          src/git/format.ts: "export const trimConfig = (text: string): string => text.trim();\n"
      - id: architecture-world-globals
        kind: lint
        runs: [edit, commit]
        budgetMs: 5000
        version: 2
        implementation: "eslint:architecture/world-globals"
        mustFail:
          src/git/retry.ts: "export const later = (run: () => void): void => {\n  setTimeout(run, 1000);\n};\n"
        mustPass:
          src/git/sources/ticks.ts: "export const later = (run: () => void): void => {\n  setTimeout(run, 1000);\n};\n"
          src/git/format.ts: "export const trimConfig = (text: string): string => text.trim();\n"
  - id: architecture-sources-only-emit
    statement: A source imports no sink, and every function a source exports returns an Observable.
    terms: [source, sink]
    paths: ["**/sources/**"]
    conflictsWith: []
    guardrails:
      - id: architecture-source-shape
        kind: lint
        runs: [edit, commit]
        budgetMs: 5000
        version: 2
        implementation: "eslint:architecture/source-shape"
        mustFail:
          src/git/sources/status.ts: "import { writeStatus } from \"../sinks/status\";\nexport const readStatus = (): number => writeStatus(1);\n"
        mustPass:
          src/git/sources/status.ts: "import { Observable } from \"rxjs\";\nexport const watchStatus = (): Observable<number> => new Observable<number>((subscriber) => subscriber.next(1));\n"
  - id: architecture-sinks-import-no-source
    statement: A sink imports no source.
    terms: [source, sink, composition-root]
    paths: ["**/sinks/**"]
    conflictsWith: []
    guardrails:
      - id: architecture-sink-imports-no-source
        kind: lint
        runs: [edit, commit]
        budgetMs: 5000
        version: 1
        implementation: "eslint:architecture/sink-imports-no-source"
        mustFail:
          src/git/sinks/status.ts: "import { watchStatus } from \"../sources/status\";\nexport const store = watchStatus;\n"
        mustPass:
          src/git/sinks/status.ts: "import type { Status } from \"../sources/status\";\nexport const store = (status: Status): Status => status;\n"
  - id: architecture-store-writes-only-in-sinks
    statement: Only a sink writes a store.
    terms: [sink]
    paths: ["!**/{sinks/**,test/**,tests/**,__tests__/**,*.test.*,*.spec.*,*.config.*}"]
    conflictsWith: []
    guardrails:
      - id: architecture-store-writes
        kind: lint
        runs: [edit, commit]
        budgetMs: 5000
        version: 1
        implementation: "eslint:architecture/store-writes-only-in-sinks"
        mustFail:
          src/git/format.ts: "import { insert } from \"rxdb\";\nexport const save = insert;\n"
        mustPass:
          src/git/sinks/status.ts: "import { insert } from \"rxdb\";\nexport const save = insert;\n"
          src/git/format.ts: "export const trimConfig = (text: string): string => text.trim();\n"
  - id: architecture-group-boundaries
    statement: Outside a group, code imports only the group's port.
    terms: [group, port, composition-root]
    paths: ["**/*.{ts,tsx,mts,cts,js,mjs,cjs}"]
    conflictsWith: []
    guardrails:
      - id: architecture-group-boundaries
        kind: lint
        runs: [edit, commit]
        budgetMs: 5000
        version: 1
        implementation: "eslint:architecture/group-boundaries"
        mustFail:
          "src/[services]/process-service/run.ts": "import { watch } from \"../git-service/sources/status-watcher\";\nexport const run = watch;\n"
          "src/[services]/git-service/sources/status-watcher.ts": "export const watch = 1;\n"
        mustPass:
          "src/[services]/process-service/run.ts": "import type { GitService } from \"../git-service/git-service\";\nexport type Run = GitService;\n"
          "src/[services]/git-service/git-service.ts": "export type GitService = { status: () => number };\n"
          "src/[services]/git-service/create.ts": "export const create = (): number => 1;\n"
          "src/main.ts": "import { create } from \"./[services]/git-service/create\";\nexport const git = create;\n"
  - id: architecture-port-shape
    statement: A port declares only types and imports only types.
    terms: [port, group]
    paths: ["**/*.{ts,tsx,mts,cts,js,mjs,cjs}"]
    conflictsWith: []
    guardrails:
      - id: architecture-port-shape
        kind: lint
        runs: [edit, commit]
        budgetMs: 5000
        version: 1
        implementation: "eslint:architecture/port-shape"
        mustFail:
          "src/[services]/git-service/git-service.ts": "export { create } from \"./create\";\n"
          "src/[services]/git-service/create.ts": "export const create = (): number => 1;\n"
        mustPass:
          "src/[services]/git-service/git-service.ts": "import type { Clock } from \"../clock-service/clock-service\";\nexport type GitStatus = number;\nexport type CreateGitService = (clock: Clock) => { status: () => GitStatus };\n"
          "src/[services]/clock-service/clock-service.ts": "export type Clock = { now: () => number };\n"
  - id: architecture-implements-port
    statement: Every implementation's create is typed by its port's factory type.
    terms: [implementation, port]
    paths: ["**/*.{ts,tsx,mts,cts,js,mjs,cjs}"]
    conflictsWith: []
    guardrails:
      - id: architecture-implements-port
        kind: lint
        runs: [edit, commit]
        budgetMs: 5000
        version: 1
        implementation: "eslint:architecture/implements-port"
        mustFail:
          "src/[services]/git-service/adapters/cli/create.ts": "export const create = () => ({ status: (): number => 1 });\n"
          "src/[services]/git-service/git-service.ts": "export type CreateGitService = () => { status: () => number };\n"
        mustPass:
          "src/[services]/git-service/adapters/cli/create.ts": "import type { CreateGitService } from \"../../git-service\";\nexport const create: CreateGitService = () => ({ status: (): number => 1 });\n"
          "src/[services]/git-service/git-service.ts": "export type CreateGitService = () => { status: () => number };\n"
  - id: architecture-adapter-isolation
    statement: An adapter never imports another adapter.
    terms: [adapter]
    paths: ["**/adapters/*/**"]
    conflictsWith: []
    guardrails:
      - id: architecture-adapter-isolation
        kind: lint
        runs: [edit, commit]
        budgetMs: 5000
        version: 1
        implementation: "eslint:architecture/adapter-isolation"
        mustFail:
          "src/[services]/git-service/adapters/libgit2/parse.ts": "import { parse } from \"../cli/parse\";\nexport const read = parse;\n"
        mustPass:
          "src/[services]/git-service/adapters/libgit2/parse.ts": "import { parse } from \"../../parse\";\nimport { scan } from \"./scan\";\nexport const read = [parse, scan];\n"
  - id: architecture-conformance
    statement: Every port has a conformance suite, and every implementation runs it.
    terms: [port, conformance-suite, implementation]
    paths: ["**/*"]
    conflictsWith: []
    guardrails:
      - id: architecture-conformance-present
        kind: lint
        runs: [commit, boundary]
        budgetMs: 5000
        version: 1
        implementation: "fs:architecture/conformance-present"
        mustFail:
          "src/[services]/git-service/git-service.ts": "export type GitStatus = number;\n"
        mustPass:
          "src/[services]/git-service/git-service.ts": "export type GitStatus = number;\n"
          "src/[services]/git-service/git-service.conformance.ts": "export const runGitConformance = (create: () => number): boolean => create() === 1;\n"
      - id: architecture-runs-conformance
        kind: lint
        runs: [commit, boundary]
        budgetMs: 5000
        version: 1
        implementation: "graph:architecture/runs-conformance"
        mustFail:
          "src/[services]/git-service/git-service.conformance.ts": "export const runGitConformance = (create: () => number): boolean => create() === 1;\n"
          "src/[services]/git-service/create.ts": "export const create = (): number => 1;\n"
          "src/[services]/git-service/create.test.ts": "import { create } from \"./create\";\nexport const ran = create() === 1;\n"
        mustPass:
          "src/[services]/git-service/git-service.conformance.ts": "export const runGitConformance = (create: () => number): boolean => create() === 1;\n"
          "src/[services]/git-service/create.ts": "export const create = (): number => 1;\n"
          "src/[services]/git-service/create.test.ts": "import { runGitConformance } from \"./git-service.conformance\";\nimport { create } from \"./create\";\nexport const ran = runGitConformance(create);\n"
  - id: architecture-group-named-by-term
    statement: A group is named for a defined Term.
    terms: [group]
    paths: ["**/*"]
    conflictsWith: []
    guardrails:
      - id: architecture-group-named-by-term
        kind: lint
        runs: [commit, boundary]
        budgetMs: 5000
        version: 1
        implementation: "fs:architecture/group-named-by-term"
        mustFail:
          "src/[services]/helpers-service/helpers-service.ts": "export type Helper = number;\n"
        mustPass:
          "src/[services]/source-service/source-service.ts": "export type Source = number;\n"
  - id: architecture-shared-by-two-groups
    statement: An item of a technical collection serves at least two groups.
    terms: [group]
    paths: ["**/*"]
    conflictsWith: []
    guardrails:
      - id: architecture-shared-by-two-groups
        kind: lint
        runs: [commit, boundary]
        budgetMs: 5000
        version: 1
        implementation: "graph:architecture/shared-by-two-groups"
        mustFail:
          "src/[utils]/canonical-json.ts": "export const canonical = (value: unknown): string => JSON.stringify(value);\n"
          "src/[services]/git-service/format.ts": "import { canonical } from \"../../[utils]/canonical-json\";\nexport const format = canonical;\n"
        mustPass:
          "src/[utils]/canonical-json.ts": "export const canonical = (value: unknown): string => JSON.stringify(value);\n"
          "src/[services]/git-service/format.ts": "import { canonical } from \"../../[utils]/canonical-json\";\nexport const format = canonical;\n"
          "src/[services]/process-service/format.ts": "import { canonical } from \"../../[utils]/canonical-json\";\nexport const format = canonical;\n"
  - id: architecture-acyclic-groups
    statement: Groups depend on each other without cycles.
    terms: [group]
    paths: ["**/*"]
    conflictsWith: []
    guardrails:
      - id: architecture-acyclic-groups
        kind: lint
        runs: [commit, boundary]
        budgetMs: 5000
        version: 1
        implementation: "graph:architecture/acyclic-groups"
        mustFail:
          "src/[services]/git-service/git-service.ts": "import type { Run } from \"../process-service/process-service\";\nexport type Git = Run;\n"
          "src/[services]/process-service/process-service.ts": "import type { Git } from \"../git-service/git-service\";\nexport type Run = Git;\n"
        mustPass:
          "src/[services]/git-service/git-service.ts": "export type Git = number;\n"
          "src/[services]/process-service/process-service.ts": "import type { Git } from \"../git-service/git-service\";\nexport type Run = Git;\n"
