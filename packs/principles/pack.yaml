id: principles
layer: 2
terms: []
settings:
  type: object
  additionalProperties: false
  properties:
    contractExports: { type: array, items: { type: string, minLength: 1 }, default: [] }
    entryPoints: { type: array, items: { type: string, minLength: 1 }, uniqueItems: true }
    generatedPaths: { description: Repository-relative glob patterns for generated code, type: array, items: { type: string, minLength: 1 }, uniqueItems: true }
practices:
  - id: small-functions
    statement: Functions stay small. Complexity at most 10, so at most 9 decisions such as if, loop, case, ?:, &&, ||, and ??; at most 3 levels of nesting, 50 lines, and 4 parameters.
    terms: []
    paths: ["**/*.{ts,tsx,mts,cts,js,mjs,cjs}"]
    conflictsWith: []
    guardrails:
      - id: principles-complexity
        kind: lint
        runs: [edit, commit]
        budgetMs: 5000
        version: 1
        implementation: "eslint:complexity"
        options: [{ max: 10 }]
        mustFail: "export const f = (a: number): number => {\n  if (a === 0) return 0;\n  if (a === 1) return 1;\n  if (a === 2) return 2;\n  if (a === 3) return 3;\n  if (a === 4) return 4;\n  if (a === 5) return 5;\n  if (a === 6) return 6;\n  if (a === 7) return 7;\n  if (a === 8) return 8;\n  if (a === 9) return 9;\n  return a;\n};\n"
        mustPass: "export const f = (a: number): number => {\n  if (a === 0) return 0;\n  if (a === 1) return 1;\n  if (a === 2) return 2;\n  if (a === 3) return 3;\n  if (a === 4) return 4;\n  if (a === 5) return 5;\n  if (a === 6) return 6;\n  if (a === 7) return 7;\n  if (a === 8) return 8;\n  return a;\n};\n"
      - id: principles-nesting-depth
        kind: lint
        runs: [edit, commit]
        budgetMs: 5000
        version: 1
        implementation: "eslint:max-depth"
        options: [{ max: 3 }]
        mustFail: "export const f = (a: number): void => {\n  if (a > 0) {\n    if (a > 1) {\n      if (a > 2) {\n        if (a > 3) {\n        }\n      }\n    }\n  }\n};\n"
        mustPass: "export const f = (a: number): void => {\n  if (a > 0) {\n    if (a > 1) {\n      if (a > 2) {\n      }\n    }\n  }\n};\n"
      - id: principles-function-length
        kind: lint
        runs: [edit, commit]
        budgetMs: 5000
        version: 1
        implementation: "eslint:max-lines-per-function"
        options: [{ max: 50, skipBlankLines: true, skipComments: true }]
        mustFail: "export const f = (): void => {\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n  Math.abs(1);\n};\n"
        mustPass: "const wait = (): void => {\n  Math.abs(1);\n};\nexport const f = (): void => {\n  wait();\n  wait();\n};\n"
      - id: principles-parameter-count
        kind: lint
        runs: [edit, commit]
        budgetMs: 5000
        version: 1
        implementation: "eslint:max-params"
        options: [{ max: 4 }]
        mustFail: "export const f = (a: number, b: number, c: number, d: number, e: number): number => a + b + c + d + e;\n"
        mustPass: "export const f = (a: number, b: number, c: number, d: number): number => a + b + c + d;\n"
  - id: one-responsibility-per-file
    statement: A file holds one responsibility. At most 300 lines and one class.
    terms: []
    paths: ["**/*.{ts,tsx,mts,cts,js,mjs,cjs}"]
    conflictsWith: []
    guardrails:
      - id: principles-file-length
        kind: lint
        runs: [edit, commit]
        budgetMs: 5000
        version: 1
        implementation: "eslint:max-lines"
        options: [{ max: 300, skipBlankLines: true, skipComments: true }]
        mustFail: "export const x0 = 0;\nexport const x1 = 1;\nexport const x2 = 2;\nexport const x3 = 3;\nexport const x4 = 4;\nexport const x5 = 5;\nexport const x6 = 6;\nexport const x7 = 7;\nexport const x8 = 8;\nexport const x9 = 9;\nexport const x10 = 10;\nexport const x11 = 11;\nexport const x12 = 12;\nexport const x13 = 13;\nexport const x14 = 14;\nexport const x15 = 15;\nexport const x16 = 16;\nexport const x17 = 17;\nexport const x18 = 18;\nexport const x19 = 19;\nexport const x20 = 20;\nexport const x21 = 21;\nexport const x22 = 22;\nexport const x23 = 23;\nexport const x24 = 24;\nexport const x25 = 25;\nexport const x26 = 26;\nexport const x27 = 27;\nexport const x28 = 28;\nexport const x29 = 29;\nexport const x30 = 30;\nexport const x31 = 31;\nexport const x32 = 32;\nexport const x33 = 33;\nexport const x34 = 34;\nexport const x35 = 35;\nexport const x36 = 36;\nexport const x37 = 37;\nexport const x38 = 38;\nexport const x39 = 39;\nexport const x40 = 40;\nexport const x41 = 41;\nexport const x42 = 42;\nexport const x43 = 43;\nexport const x44 = 44;\nexport const x45 = 45;\nexport const x46 = 46;\nexport const x47 = 47;\nexport const x48 = 48;\nexport const x49 = 49;\nexport const x50 = 50;\nexport const x51 = 51;\nexport const x52 = 52;\nexport const x53 = 53;\nexport const x54 = 54;\nexport const x55 = 55;\nexport const x56 = 56;\nexport const x57 = 57;\nexport const x58 = 58;\nexport const x59 = 59;\nexport const x60 = 60;\nexport const x61 = 61;\nexport const x62 = 62;\nexport const x63 = 63;\nexport const x64 = 64;\nexport const x65 = 65;\nexport const x66 = 66;\nexport const x67 = 67;\nexport const x68 = 68;\nexport const x69 = 69;\nexport const x70 = 70;\nexport const x71 = 71;\nexport const x72 = 72;\nexport const x73 = 73;\nexport const x74 = 74;\nexport const x75 = 75;\nexport const x76 = 76;\nexport const x77 = 77;\nexport const x78 = 78;\nexport const x79 = 79;\nexport const x80 = 80;\nexport const x81 = 81;\nexport const x82 = 82;\nexport co