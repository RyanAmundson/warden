x238 = 238;\nexport const x239 = 239;\nexport const x240 = 240;\nexport const x241 = 241;\nexport const x242 = 242;\nexport const x243 = 243;\nexport const x244 = 244;\nexport const x245 = 245;\nexport const x246 = 246;\nexport const x247 = 247;\nexport const x248 = 248;\nexport const x249 = 249;\nexport const x250 = 250;\nexport const x251 = 251;\nexport const x252 = 252;\nexport const x253 = 253;\nexport const x254 = 254;\nexport const x255 = 255;\nexport const x256 = 256;\nexport const x257 = 257;\nexport const x258 = 258;\nexport const x259 = 259;\nexport const x260 = 260;\nexport const x261 = 261;\nexport const x262 = 262;\nexport const x263 = 263;\nexport const x264 = 264;\nexport const x265 = 265;\nexport const x266 = 266;\nexport const x267 = 267;\nexport const x268 = 268;\nexport const x269 = 269;\nexport const x270 = 270;\nexport const x271 = 271;\nexport const x272 = 272;\nexport const x273 = 273;\nexport const x274 = 274;\nexport const x275 = 275;\nexport const x276 = 276;\nexport const x277 = 277;\nexport const x278 = 278;\nexport const x279 = 279;\nexport const x280 = 280;\nexport const x281 = 281;\nexport const x282 = 282;\nexport const x283 = 283;\nexport const x284 = 284;\nexport const x285 = 285;\nexport const x286 = 286;\nexport const x287 = 287;\nexport const x288 = 288;\nexport const x289 = 289;\nexport const x290 = 290;\nexport const x291 = 291;\nexport const x292 = 292;\nexport const x293 = 293;\nexport const x294 = 294;\nexport const x295 = 295;\nexport const x296 = 296;\nexport const x297 = 297;\nexport const x298 = 298;\nexport const x299 = 299;\nexport const x300 = 300;\n"
        mustPass: "export const x = 1;\n"
      - id: principles-one-class-per-file
        kind: lint
        runs: [edit, commit]
        budgetMs: 5000
        version: 1
        implementation: "eslint:max-classes-per-file"
        options: [1]
        mustFail: "export class A {}\nexport class B {}\n"
        mustPass: "export class A {}\n"
  - id: no-unused-code
    statement: Code declares nothing it does not use. No unused local, no unused parameter or type parameter, no useless constructor, and no unused private member.
    terms: []
    paths: ["**/*.{ts,tsx,mts,cts,js,mjs,cjs}"]
    conflictsWith: []
    guardrails:
      - id: principles-unused-locals
        kind: lint
        runs: [edit, commit]
        budgetMs: 5000
        version: 1
        implementation: "eslint:no-unused-vars"
        options: [{ args: "none", ignoreRestSiblings: true }]
        mustFail: "const unused = 1;\n"
        mustPass: "export const used = 1;\n"
      - id: principles-useless-constructor
        kind: lint
        runs: [edit, commit]
        budgetMs: 5000
        version: 1
        implementation: "eslint:no-useless-constructor"
        mustFail: "export class A {\n  constructor() {}\n}\n"
        mustPass: "export class A {\n  readonly x: number;\n  constructor() {\n    this.x = 1;\n  }\n}\n"
      - id: principles-unused-private-members
        kind: lint
        runs: [edit, commit]
        budgetMs: 5000
        version: 1
        implementation: "eslint:no-unused-private-class-members"
        mustFail: "export class A {\n  #x = 1;\n}\n"
        mustPass: "export class A {\n  #x = 1;\n  get x(): number {\n    return this.#x;\n  }\n}\n"
      - id: principles-unused-parameters
        kind: type
        runs: [commit]
        budgetMs: 60000
        version: 1
        implementation: "tsc:noUnusedParameters"
        mustFail: "export const f = (unused: number): number => 1;\n"
        mustPass: "export const f = (used: number): number => used;\n"
  - id: no-repeated-code
    statement: No block of 8 or more significant lines appears twice. A significant line has a letter or digit outside comments, import and export lists, and TypeScript type alias and interface declarations. Test, spec, story, declaration, and generated files listed in the generatedPaths setting are excluded.
    terms: []
    paths: ["**/*.{ts,tsx,mts,cts,js,mjs,cjs}"]
    conflictsWith: []
    guardrails:
      - id: principles-duplicate-blocks
        kind: lint
        runs: [boundary]
        budgetMs: 5000
        version: 2
        implementation: "fs:principles/duplicate-blocks"
        mustFail:
          src/a.ts: "export const a = (n: number): number => {\n  const x1 = n + 1;\n  const x2 = x1 * 2;\n  const x3 = x2 - 3;\n  const x4 = x3 / 4;\n  const x5 = x4 % 5;\n  const x6 = x5 + 6;\n  const x7 = x6 * 7;\n  return x7;\n};\n"
          src/b.ts: "export const b = (n: number): number => {\n  const x1 = n + 1;\n  const x2 = x1 * 2;\n  const x3 = x2 - 3;\n  const x4 = x3 / 4;\n  const x5 = x4 % 5;\n  const x6 = x5 + 6;\n  const x7 = x6 * 7;\n  return x7;\n};\n"
        mustPass:
          src/a.ts: "export default (n: number): number => n + 1;\n"
          src/b.ts: "import step from \"./a\";\nconsole.log(step(1));\n"
  - id: no-speculative-code
    statement: Code builds nothing ahead of need. Every export of a file that another file imports is imported by another file, unless the file is listed in the entryPoints setting. Files no other file imports and declared entry points expose their exports as their public interface. An interface has more than one implementing class unless it sits in a port, the file named after its group folder inside a bracketed collection. Test, spec, and story files count as users but are not checked. Export-star barrels count as uses. Framework names such as metadata, GET, and loader, and names listed in the contractExports setting, are exempt.
    terms: []
    paths: ["**/*.{ts,tsx,mts,cts,js,mjs,cjs}"]
    conflictsWith: []
    guardrails:
      - id: principles-unused-exports
        kind: lint
        runs: [boundary]
        budgetMs: 5000
        version: 2
        implementation: "graph:principles/unused-exports"
        mustFail:
          src/a.ts: "export const step = (n: number): number => n + 1;\nexport const twice = (n: number): number => n * 2;\n"
          src/b.ts: "import { step } from \"./a\";\nconsole.log(step(1));\n"
        mustPass:
          src/a.ts: "export const step = (n: number): number => n + 1;\n"
          src/b.ts: "import { step } from \"./a\";\nconsole.log(step(1));\n"
      - id: principles-single-implementation
        kind: lint
        runs: [boundary]
        budgetMs: 5000
        version: 1
        implementation: "fs:principles/single-implementation"
        mustFail:
          src/shape.ts: "export interface Shape {\n  area(): number;\n}\n"
          src/square.ts: "import type { Shape } from \"./shape\";\nexport class Square implements Shape {\n  area(): number {\n    return 1;\n  }\n}\n"
        mustPass:
          src/shape.ts: "export interface Shape {\n  area(): number;\n}\n"
          src/square.ts: "import type { Shape } from \"./shape\";\nexport class Square implements Shape {\n  area(): number {\n    return 1;\n  }\n}\n"
          src/circle.ts: "import type { Shape } from \"./shape\";\nexport class Circle implements Shape {\n  area(): number {\n    return 3;\n  }\n}\n"
  - id: one-home-per-name
    statement: Each exported name is declared in one file, and other files import it from there. Re-exports and default exports are not declarations; names a framework requires, such as metadata, GET, and loader, and names the project lists in the contractExports setting, are exempt; create files, test, spec, story, and declaration files are not read.
    terms: []
    paths: ["**/*.{ts,tsx,mts,cts,js,mjs,cjs}"]
    conflictsWith: []
    guardrails:
      - id: principles-duplicate-exports
        kind: lint
        runs: [boundary]
        budgetMs: 5000
        version: 1
        implementation: "fs:principles/duplicate-exports"
        mustFail:
          src/a.ts: "export const step = (n: number): number => n + 1;\n"
          src/b.ts: "export const step = (n: number): number => n + 2;\n"
        mustPass:
          src/a.ts: "export default (n: number): number => n + 1;\n"
          src/index.ts: "export { default as step } from \"./a\";\n"
